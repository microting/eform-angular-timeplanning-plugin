<aside class="tp-help-panel" *ngIf="isOpen" role="complementary" [attr.aria-label]="ui.help">
  <header class="tp-help-panel__top">
    <h5>{{ ui.help }}</h5>
    <span class="tp-help-panel__spacer"></span>
    <button type="button" mat-icon-button [attr.aria-label]="ui.close" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="tp-help-panel__search">
    <mat-icon aria-hidden="true">search</mat-icon>
    <input
      type="search"
      [ngModel]="query"
      (ngModelChange)="onQueryChange($event)"
      [attr.aria-label]="ui.searchHelp"
      [placeholder]="ui.searchHelp"/>
    <button type="button" *ngIf="isSearching" [attr.aria-label]="ui.clear" (click)="clearQuery()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="tp-help-panel__replay">
    <button type="button" (click)="replayTour()">{{ ui.replayTour }}</button>
  </div>

  <div class="tp-help-panel__body">
    <ng-container *ngIf="isSearching; else browse">
      <p class="tp-help-panel__count" *ngIf="isFallback; else resultCount">
        &ldquo;{{ query }}&rdquo; &mdash; {{ ui.noResults }}
      </p>
      <ng-template #resultCount>
        <p class="tp-help-panel__count">
          {{ results.length }} {{ results.length === 1 ? ui.resultCountOne : ui.resultCount }}
        </p>
      </ng-template>
      <article
        class="tp-help-entry"
        *ngFor="let result of results"
        [class.tp-help-entry--target]="result.entry.id === targetId">
        <button type="button" class="tp-help-entry__head" (click)="toggleEntry(result.entry.id)">
          <!-- An icon carries the distinction visually; the label carries it for screen readers. -->
          <span
            class="tp-help-entry__kind"
            [class.tp-help-entry__kind--task]="result.entry.kind === 'task'"
            [attr.aria-label]="kindLabel(result.entry)">
            <mat-icon aria-hidden="true">
              {{ result.entry.kind === 'task' ? 'playlist_add_check' : 'tune' }}
            </mat-icon>
          </span>
          <b>{{ result.prose.title }}</b>
        </button>
        <p>{{ result.prose.short }}</p>
        <ng-container
          *ngIf="expanded === result.entry.id"
          [ngTemplateOutlet]="entryDetail"
          [ngTemplateOutletContext]="{ id: result.entry.id, prose: result.prose }"></ng-container>
      </article>
    </ng-container>

    <ng-template #browse>
      <ng-container *ngFor="let group of sections">
        <h6 class="tp-help-panel__section">{{ sectionLabel(group.section) }}</h6>
        <article
          class="tp-help-entry"
          *ngFor="let entry of group.entries"
          [class.tp-help-entry--target]="entry.id === targetId">
          <ng-container *ngIf="prose(entry.id) as entryProse">
            <button type="button" class="tp-help-entry__head" (click)="toggleEntry(entry.id)">
              <b>{{ entryProse.title }}</b>
            </button>
            <p>{{ entryProse.short }}</p>
            <ng-container
              *ngIf="expanded === entry.id"
              [ngTemplateOutlet]="entryDetail"
              [ngTemplateOutletContext]="{ id: entry.id, prose: entryProse }"></ng-container>
          </ng-container>
        </article>
      </ng-container>
    </ng-template>
  </div>
</aside>

<!--
  The expanded body of one entry, shared by the search results and the browse list.
  A task ends by pointing at the controls it touches: each is a link that moves the
  panel to that entry, through the same deep-link target the help icons use.
-->
<ng-template #entryDetail let-id="id" let-entryProse="prose">
  <p class="tp-help-entry__detail" *ngIf="entryProse.detail">{{ entryProse.detail }}</p>
  <ol class="tp-help-entry__steps" *ngIf="entryProse.steps">
    <li *ngFor="let step of entryProse.steps">{{ step }}</li>
  </ol>
  <ng-container *ngIf="related(id).length > 0">
    <p class="tp-help-entry__related-title">{{ ui.relatedControls }}</p>
    <ul class="tp-help-entry__related">
      <li *ngFor="let relatedId of related(id)">
        <button
          type="button"
          class="tp-help-entry__related-link"
          (click)="openRelated(relatedId)">
          {{ prose(relatedId).title }}
        </button>
      </li>
    </ul>
  </ng-container>
</ng-template>
