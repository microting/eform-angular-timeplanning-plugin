<mtx-grid
  [data]="flexPlannings"
  [columns]="tableHeaders"
  [cellTemplate]="{sumFlex: timePlanningSumFlexTpl, commentOffice: commentOfficeTpl}"
  [showPaginator]="false"
  [pageOnFront]="false"
  [rowStriped]="false"
  [showToolbar]="false"
  [showColumnMenuButton]="false">
</mtx-grid>

<ng-template #timePlanningSumFlexTpl let-row let-i="index">
  <mat-form-field id="timePlanningSumFlex{{i}}" class="my-1">
    <input
      matInput
      type="number"
      id="sumFlex{{i}}"
      [disabled]="true"
      [ngModel]="row.sumFlex"
    />
  </mat-form-field>
</ng-template>

<ng-template #commentOfficeTpl let-row let-i="index">
  <mat-form-field id="timePlanningCommentOffice{{i}}" (click)="onCommentOfficeClick(row)">
    <input
      matInput
      type="text"
      id="commentOffice{{i}}"
      [disabled]="true"
      [ngModel]="row.commentOffice.slice(0, 20) + '...'"
    >
  </mat-form-field>
</ng-template>
